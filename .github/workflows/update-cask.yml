name: Update Cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update to the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # update CASK REPOSITORY APP: points Casks/CASK.rb at the latest release of REPOSITORY.
          update() {
            CASK="$1"
            REPOSITORY="$2"
            APP="$3"
            FILE="Casks/$CASK.rb"

            if ! VERSION="$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name | ltrimstr("v")')"; then
              echo "$APP has no release yet."
              return 0
            fi
            SHA256="$(gh api "repos/$REPOSITORY/releases/latest" --jq ".assets[] | select(.name | endswith(\"-macOS.dmg\")) | select(.name != \"$APP-macOS.dmg\") | .digest | ltrimstr(\"sha256:\")")"
            CURRENT_VERSION="$(ruby -ne 'puts $1 if /^  version "([^"]+)"/' "$FILE")"
            CURRENT_SHA256="$(ruby -ne 'puts $1 if /^  sha256 "([^"]+)"/' "$FILE")"

            if [ "$VERSION" = "$CURRENT_VERSION" ] && [ "$SHA256" = "$CURRENT_SHA256" ]; then
              echo "$APP $VERSION is already current."
              return 0
            fi

            VERSION="$VERSION" SHA256="$SHA256" ruby -pi -e '
              $_.sub!(/^  version ".*"$/, %(  version "#{ENV.fetch("VERSION")}"))
              $_.sub!(/^  sha256 ".*"$/, %(  sha256 "#{ENV.fetch("SHA256")}"))
            ' "$FILE"

            ruby -c "$FILE"
            git diff --check
            git add "$FILE"
            git \
              -c user.name="$(gh api "repos/$REPOSITORY/commits/v$VERSION" --jq .commit.author.name)" \
              -c user.email="$(gh api "repos/$REPOSITORY/commits/v$VERSION" --jq .commit.author.email)" \
              commit -m "Update $APP to $VERSION"
          }

          update potenad PoteNad/potenad PoteNad
          update plainst PoteNad/plainst Plainst
          git push
